; =====================================================================
; PlcMesBridge 现场配置样例（复制为 config\config.ini 后按现场改）
; 缺键启动时自动回填缺省（IniFile 自愈），本文件仅作对照与说明。
; 程序目录结构：exe 同目录 config\config.ini / config\mes_params.json /
;   DataBase\PLCdatabase.db3 / log\yyyy-MM-dd\log.txt /
;   Logs\MESLOG\yyyy-MM-dd\机台名.txt
; Phase 2 说明：单机模式（[SinglePLC] 段 / Mode 键 / PLCAscii 协议键 /
;   MESPLCALarm 老键）已随三菱链路删除；ini 残留旧键无害，程序不再读取。
; 真机底座统一 Modbus TCP：地址=剥 R/D 取数字=Modbus 协议地址
;   （0x0000 起，保持寄存器），详见 ModbusStationClient.cs 头注释。
; =====================================================================

[setting]
; 运行语言：CH 中文 / EN 英文（界面语言按钮切换后自动改这里）
Language=CH
; 联调开关：1=内存模拟 PLC（无真机跑通全流程），0=连真机
Simulate=0
; 字符串字节序（程序②整线网关，W68 联调预备）：BigEndian=老项目口径（缺省，
;   "NG"→寄存器 0x4E47 高字节在先）；CIM 侧按低字节在先组包时改 SwapBytes
;   （读写串按字节对交换，现场校准零改代码）
StringByteOrder=BigEndian
; 网关触发扫描周期 ms（程序②整线网关轮询各机台触发字的间隔，缺省 200；
;   范围 50~5000 钳制；PLC配置窗可改，保存即热生效无需重连）
ScanIntervalMs=200
; 多机启用开关（8 台，1=连接，0=跳过）
PLCuse=1,1,1,1,1,1,1,1
; 多机 PLC 地址（键名跳号是历史沿用：2..7,9,10 对应 0..7 号机）
PLCIP2=192.168.1.10
PLCIP3=192.168.1.30
PLCIP4=192.168.1.40
PLCIP5=192.168.1.50
PLCIP6=192.168.1.60
PLCIP7=192.168.1.70
PLCIP9=192.168.1.90
PLCIP10=192.168.1.100
; 多机端口（8 个，0..7 号机顺序；现场按 Modbus TCP 从站改，标准 502）
PLCPorts=502,502,502,502,502,502,502,502
; 登录记忆（登录窗"记住密码"按账号自动维护，无需手工改）：
; SavedUser=最后一次登录名；RememberToken_<账号>=DPAPI 密文（本机本用户可解）
; （admin 普通管理，dev 最高权限，各记各的；ini 里永无明文密码）
; SavedUser=
; RememberToken_admin=
; RememberToken_dev=
; 账号说明：账号存 DataBase\PLCdatabase.db3 users 表（PBKDF2 哈希，无明文），
; 首次启动自动播种 admin/dev；上线前必须进"设置→修改密码"改掉初始密码。

[MES]
; 6 个接口 URL
Url_API0027=http://192.168.120.129:5012/MacProduction/MacParameters
Url_API0028=http://192.168.120.129:5012/MacProduction/InsMachineDAQ
Url_API0030=http://192.168.120.129:5012/MacTraceability/BoardInOut
Url_API0031=http://192.168.120.129:5012/MacTraceability/Prelogcheck
Url_API0032=http://192.168.120.129:5012/MacTraceability/UploadMaterial
Url_API0033=http://192.168.120.129:5012/MacTraceability/UploadBadDetail
; 6 个触发字（PLC 置 1 请求上传；R 剥前缀取数字=Modbus 协议地址）
TriggerAddrAPI0027=R13000
TriggerAddrAPI0028=R16000
TriggerAddrAPI0030=R17000
TriggerAddrAPI0031=R18000
TriggerAddrAPI0032=R19000
TriggerAddrAPI0033=R12000
; PLC 内 JSON 最大字长
DataLength=799
; API0030/0031 返回 DATA 三段拆写偏移（"第2段偏移,第3段偏移"，缺省 30,60=老项目
;   口径：DATA/+30/+60）。W68 终版拆段规则不同时改这里即可，零代码适配；
;   须 2~8 段、每段 1~65535，非法整体回缺省（PLC配置窗可改）
DataSegmentOffsets=30,60
; 6 组回写地址束（PLC数据 / MES回写MSG / MES回写DATA / MES回写STATUS / 完成标志）
API0027PLCDataAddr=R13001
API0027MESMSGAddr=R13810
API0027MESDataAddr=R13900
API0027MESSTATUSAddr=R13801
API0027MESCompleteAddr=R13800
API0028PLCDataAddr=R16001
API0028MESMSGAddr=R16810
API0028MESDataAddr=R16900
API0028MESSTATUSAddr=R16801
API0028MESCompleteAddr=R16800
API0030PLCDataAddr=R17001
API0030MESMSGAddr=R17810
API0030MESDataAddr=R17900
API0030MESSTATUSAddr=R17801
API0030MESCompleteAddr=R17800
API0031PLCDataAddr=R18001
API0031MESMSGAddr=R18810
API0031MESDataAddr=R18900
API0031MESSTATUSAddr=R18801
API0031MESCompleteAddr=R18800
API0032PLCDataAddr=R19001
API0032MESMSGAddr=R19810
API0032MESDataAddr=R19900
API0032MESSTATUSAddr=R19801
API0032MESCompleteAddr=R19800
API0033PLCDataAddr=R12001
API0033MESMSGAddr=R12810
API0033MESDataAddr=R12900
API0033MESSTATUSAddr=R12801
API0033MESCompleteAddr=R12800

[CuringMes]
; ---------------------------------------------------------------------
; 单线过账（程序①固化程控专用；程序②整线网关不读本节）
; 触发映射（复刻老项目 PLC_ReadData 装载/卸载命令字）：
;   托盘到位=进站(API0030 I) / 托盘离开=固化时间(API0027)+出站(API0030 O)
;   出站被 MES 接受(STATUS=1) → 工单"已生产数量"+1
; ---------------------------------------------------------------------
; 过账总开关：1=启用（还需 URL 非空才发请求），0=停用（只程控不过账）
Enabled=0
; 自动进/出站取工单哪个工位：R / L
Side=R
; 固化时间上传单位（API0027 PRA_Value）：Seconds=秒（老项目口径）/ Minutes=分钟
TimeUnit=Seconds
; 进站上传时机：Arrive=托盘到位 / Start=开计时（门控放行后）
PostInAt=Arrive
; 计时中取件（计时作废=强制出料语义）是否照常传出站：1=传（老项目口径）/ 0=不传
PostAbortOut=1
; 架号→工位映射（可选，双架部署用）：空=全部用 Side（单架不用管）。
;   格式：架号段:工位，分号分隔多段；架号段支持 "11-20"（闭区间）或单号 "11"。
;   例：第二台固化架（全局架号 11~20，见点表第二台设备"起始架号"）报 L 工位：
;RackSides=11-20:L
RackSides=
; 静态参数（留空=回退 config\mes_params.json 记忆值，主程序调试窗可维护）
;   双架分机台时：L 工位专用值填带 _L 的键，留空=同主值（两架共用一套就都不用配）
MacNo=
MacNo_L=
MacLocNo=
MacLocNo_L=
Plant=
PraCode=
CheckResult=
; 三个接口 URL 沿用上面 [MES] 节的 Url_API0027/0030/0032（过账配置窗可改，
; 与主程序同键——两程序分机部署时各改各的 ini）
