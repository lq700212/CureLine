[CuringMes]
; ---------------------------------------------------------------------
; 单线过账（程序①固化程控专用；程序②整线网关不读本节）
; 触发映射（复刻老项目 PLC_ReadData 装载/卸载命令字，历史名称保留溯源）：
;   托盘到位=进站(API0030 I) / 托盘离开=固化时间(API0027)+出站(API0030 O)
;   出站被 MES 接受(STATUS=1) → 工单"已生产数量"+1
; ---------------------------------------------------------------------
; 过账总开关：1=启用（还需 URL 非空才发请求），0=停用（只程控不过账）
Enabled=0
; 双工位模式：1=R/L 两套工单分开记账（工单窗双面板+上传按钮两枚+架号映射与
;   Mac*_L 专用参数生效）；0=单工位（缺省，现场只有一套工位）：工单窗只显 Side
;   那侧一套、界面文案不带 R/L 字样，RackSides/Mac*_L 忽略，进/出站与物料
;   上传全按 Side 报本侧参数（过账配置窗勾选开关）
DualSide=0
; 自动进/出站取工单哪个工位：R / L（单工位模式下全部按此侧报文）
Side=R
; 固化时间上传单位（API0027 PRA_Value）：Seconds=秒（老项目口径）/ Minutes=分钟
TimeUnit=Seconds
; 进站上传时机：Arrive=托盘到位 / Start=开计时（门控放行后）
PostInAt=Arrive
; 计时中取件（计时作废=强制出料语义）是否照常传出站：1=传（老项目口径）/ 0=不传
PostAbortOut=1
; 架号→工位映射（可选，仅双工位模式生效——单工位恒用 Side）：空=全部用 Side。
;   格式：架号段:工位，分号分隔多段；架号段支持 "11-20"（闭区间）或单号 "11"。
;   例：第二台固化架（全局架号 11~20，见点表第二台设备"起始架号"）报 L 工位：
;RackSides=11-20:L
RackSides=
; 静态参数（留空=回退 config\mes_params.json 记忆值，主程序调试窗可维护）
;   双工位模式分机台时：L 工位专用值填带 _L 的键，留空=同主值；
;   单工位模式（DualSide=0）忽略这些键，只读不带 _L 的主值
MacNo=
MacNo_L=
MacLocNo=
MacLocNo_L=
Plant=
PraCode=
CheckResult=
; 三个接口 URL 沿用上面 [MES] 节的 Url_API0027/0030/0032（过账配置窗可改，
; 与主程序同键——两程序分机部署时各改各的 ini）

[Scanner]
; ---------------------------------------------------------------------
; 扫码枪（程序①固化程控专用；程序②整线网关不读本节）
;
; **连接方式（V0.0.78 起，Mode 键二选一；V0.0.79 起缺省值=现场 TCP 预置）**：
;   ① Mode=Tcp——现场现行（程序出厂缺省即此方式）：SH-5000-GHD 枪本身串口输出，
;      串口线上接一台 **Eport E10 型 DTU**（串口转以太网）；DTU Web 配置台
;      （管理账号见站点交接）已把对应 socket 配成 **TCP-SERVER、本地端口 8899、
;      路由到串口（Rout=uart）并落 NVRAM**。上位机作 TCP 客户端连入收码，
;      扫到即按行推送（毫秒级，条码文本+CR 结尾）。旧的 UDP 推送已弃用
;      （DTU 断电重启不会恢复、可靠性差——不要回退）。此方式用下面
;      TcpIp/TcpPort/TriggerCommand 三键，串口组键不参与。
;   ② Mode=Serial——替代接线（枪经"网口转 USB 转接线"直插工控机，系统里
;      表现为虚拟串口）：用下面 PortName/DeviceKeyword/串口参数组键。
;
; 扫码工序（只提示、不拦截固化流程）：
;   托盘入库前 → 先扫库位码 A01~J12 → 再扫产品二维码 → 绑定并落盘
;   （config\slotbindings.json）；固化完取件（托盘离开）绑定自动作废，
;   下次入库必须重新扫码；托盘在架却没绑定产品时统计条红字报警 + 日志一行。
; ---------------------------------------------------------------------
; 启用开关：1=按所选连接方式启动收码。**V0.0.81 起代码内置缺省=1**（出厂
;   缺省=现场口径的收口：部署目录重建/新构建覆盖后不再掉回"未启用"，现场
;   不用再手工点一次配置窗保存；未接枪的调试机想关=配置窗取消【启用】勾选
;   保存，或改回 0）；程序启动时还会把 [Scanner] 节缺的键按缺省值字面回填
;   进本文件（缺键自愈落盘，已写的键一律不碰），文件所见即程序所得
Enabled=1
; 连接方式：Tcp=以太网 TCP（出厂缺省+现场现行）/ Serial=串口；非法值回 Tcp
Mode=Tcp
; --- TCP 方式（仅 Mode=Tcp 生效）---
; 目标 IP = 枪侧 DTU 的地址（程序内置缺省=现场预置值，与本样例同值；DTU Web
;   配置台可查，管理账号见站点交接。注意留空/清空不持久——ini 读时自愈
;   回预置值；想不连 TCP=把 Mode 改 Serial 或把 Enabled 置 0）
TcpIp=169.254.173.207
; TCP 端口 = DTU TCP-SERVER 的本地端口（现场现值 8899；改 DTU 配置后同步改）
TcpPort=8899
; 触发指令（连上后自动发送、尾补 CRLF；可留空）：**现场必须留空=不发**——
;   这台枪自动连续读码，连上发任何指令都会被 DTU 当成串口数据写进枪，
;   可能干扰读码；只有接基恩士 SR 这类"连上要发 LON 开激光"的枪才填
TriggerCommand=
; --- 串口方式（仅 Mode=Serial 生效）---
; 串口定位二选一（PortName 优先）：
;   ① PortName = 设备管理器里的 COM 号（如 COM3）——最直接，换 USB 口要改；
;   ② PortName 留空 + DeviceKeyword = 设备名关键字（转接线虚拟串口设备名
;      一般含 USB，如 "USB-SERIAL CH340 (COM3)"）——WMI 自动找口，换 USB
;      口免改配置（现场无转接直连时不需要）；
;   Mode=Serial 且两者都空 = 未配置扫码枪（不启动，统计条提示"未配置串口"）
PortName=
DeviceKeyword=USB
; 串口参数（按扫码枪手册核对；缺省 9600-8-N-1 是常见出厂值）
BaudRate=9600
DataBits=8
; 停止位：1 / 15 / 2（15=1.5 位）
StopBits=1
; 校验位：None / Odd / Even / Mark / Space
Parity=None
; 扫码会话超时秒数（扫库位码后等产品码的最长间隔，5~600；两方式共用）：
;   超时自动回到"请扫库位码"，防止界面挂着旧库位误导下一名操作员
SessionTimeoutSeconds=15
; 串口心跳调试日志（排障用，仅 Serial 方式生效）：1=每个心跳周期把 WMI
;   找口过程写进操作日志，用于排查"插着枪却识别不到"；正常生产保持 0
DebugLog=0

; ---------------------------------------------------------------------
; 软件授权（V0.0.62 起真源在 kaleidoscope 子模块，授权状态不再存本 ini）：
;   状态文件 = exe 同目录 MainSetting\LicenseState.ini（激活窗自动维护，
;   现场不要手工编辑）；防回拨水位三存储 = 该 ini WaterMark 键 +
;   HKCU\Software\CureLine\License + DataBase\CureLine.db3 app_meta 键
;   LicenseWaterMark（三处取最大 + exe 时间兜底）。详见 README「软件授权」。
; 演示模式 [setting] Simulate=1 时免激活放行（仅联调演示，不得用于生产）。
