; =====================================================================
; CureLine 现场配置样例（复制为 config\config.ini 后按现场改）
; 缺键启动时自动回填缺省（IniFile 自愈），本文件仅作对照与说明。
; 程序目录结构：exe 同目录 config\config.ini / config\mes_params.json /
;   DataBase\CureLine.db3 / log\yyyy-MM-dd\log.txt /
;   Logs\MESLOG\yyyy-MM-dd\机台名.txt
; Phase 2 说明：单机模式配置段与 Mode/ASCII 协议/老报警键已随三菱链路删除；
;   ini 残留旧键无害，程序不再读取。
; 真机底座统一 Modbus TCP：地址=剥 R/D 取数字=Modbus 协议地址
;   （0x0000 起，保持寄存器），详见 ModbusStationClient.cs 头注释。
; =====================================================================

[setting]
; 运行语言：CH 中文 / EN 英文（界面语言按钮切换后自动改这里）
Language=CH
; 联调开关：1=内存模拟机台（无真机跑通全流程），0=连真机；
;   程序①主窗【演示】按钮可即时切换本键并热生效（L4 门禁），改这里只是开机初值
Simulate=0
; 主窗主题（两程序共用同名键，各自 exe 目录的 config.ini 独立生效）：
;   Light=G2 浅色渐变浸染（缺省）/ Dark=G1 深空玻璃舱；主窗右上
;   【深色/浅色】按钮切换即本键自动落盘；非法值开机自动回 Light
Theme=Light
; 字符串字节序（程序②整线网关，W68 联调预备）：BigEndian=老项目口径（缺省，
;   "NG"→寄存器 0x4E47 高字节在先）；CIM 侧按低字节在先组包时改 SwapBytes
;   （读写串按字节对交换，现场校准零改代码）
StringByteOrder=BigEndian
; 点表配置窗"点号显示"形态（程序①点表窗右上单下拉）：TerminalXY=端子号
;   X8/YF（GFNB 耦合器丝印口径，缺省；位号按十六进制）/ TerminalIQ=端子号
;   I8/QF（IEC 口径）/ Hex0x=0x 十六进制 / Dec=十进制 / Oct=八进制 / Bin=
;   二进制——**仅显示口径**，点号数据存储恒为十进制，通讯与校验零改动；
;   选择即自动落盘本键，非法值开机回 TerminalXY
PointBitStyle=TerminalXY
; 工艺策略窗时间单位（程序①策略窗右上"单位"下拉，V0.0.53；V0.0.56 秒档删除）：
;   Hours=时（缺省，2026-11-09 用户拍板）/ Minutes=分——**仅页面显示与输入
;   换算**，策略存储与状态机计时恒为分钟；选择即自动落盘本键并同步主窗
;   卡片/统计条时长字面，非法值（含旧版 Seconds，档已删）与缺键开机自愈回
;   缺省 Hours；现场显式写 Minutes 的机器读盘为准不受缺省影响
PolicyTimeUnit=Hours
; 光栅报警复位模式（程序①，策略窗画布下方光栅条【人工｜自动】分段按钮，V0.0.69；
;   全局操作规程不随单条策略保存）：Manual=人工复位（缺省，V0.0.71 用户拍板——光栅
;   让空不复位，红灯与蜂鸣保持，程序弹出"报警复位"窗列出正在报警的库位，操作员
;   逐项/全部点【解除报警】确认后才解除；固化计时不受影响）；Auto=自动复位
;   （光栅双侧全让空即自动解除，红灯灭黄灯复亮）。选择即自动落盘本键并立即
;   生效（状态机下一拍换口径）；缺键/非法值开机自愈回 Manual
GrillAlarmResetMode=Manual
; 光栅信号极性（程序①，策略窗画布下方光栅条【常开｜常闭】分段按钮，V0.0.72；
;   全局现场接线口径不随单条策略保存）：BlockedOn=遮挡=ON（缺省，V0.0.71 及以前
;   口径——光栅被挡时 DI 为 ON、未被挡为 OFF）/ BlockedOff=遮挡=OFF（现场实测常闭
;   安全光栅：被挡 OFF、未挡 ON——选【常闭】即本值）。选择即落盘本键并立即
;   生效（状态机下一拍换口径，门控/报警/复位/日志"挡/空"全跟随，建议停机时切）；
;   缺键/非法值开机自愈回 BlockedOn
GrillSignalPolarity=BlockedOn
; 光栅报警总开关（程序①，策略窗画布下方光栅条"光栅报警"滑块开关，V0.0.90；
;   全局功能开关不随单条策略保存）：1=开启（缺省，用户拍板——计时中被挡即
;   报警：仓位红灯+机台蜂鸣+塔灯红，解除走【报警解除】模式/复位窗）；0=关闭
;   （整条报警链静默——被挡不报警、已挂着的报警当场解除红灯灭；**门控闸
;   不受影响**：开了"光栅门控"的策略照常"托盘到位要光栅让空才开计时"）。
;   切换即落盘本键并立即生效；缺键/空值/非法值开机自愈回 1（宁可多报不
;   漏报——静默只少显示，丢报警可能漏事故）
GrillAlarmEnabled=1
; 网关触发扫描周期 ms（程序②整线网关轮询各机台触发字的间隔，缺省 200；
;   范围 50~5000 钳制；网关配置窗可改，保存即热生效无需重连）
ScanIntervalMs=200
; 多机启用开关（8 台，1=连接，0=跳过）
StationUse=1,1,1,1,1,1,1,1
; 多机机台 IP（键 StationIp1..8 连续对应 1..8 号机，V0.0.32 起）
; 机台名（[StationNames] 节键 1..8，面板/日志文件名/视图下拉共用；
;   缺键回落程序缺省名，网关配置窗可改）
StationIp1=192.168.1.10
StationIp2=192.168.1.30
StationIp3=192.168.1.40
StationIp4=192.168.1.50
StationIp5=192.168.1.60
StationIp6=192.168.1.70
StationIp7=192.168.1.90
StationIp8=192.168.1.100
[StationNames]
; 8 台机台名（缺省"机台1~8"；现场 D/R 终版定后在网关配置窗改真名，
; 机台名同时是 MES 日志文件名与主窗视图筛选显示名）
1=机台1
2=机台2
3=机台3
4=机台4
5=机台5
6=机台6
7=机台7
8=机台8
; 多机端口（8 个，0..7 号机顺序；现场按 Modbus TCP 从站改，标准 502）
StationPorts=502,502,502,502,502,502,502,502
; 登录记忆（登录窗"记住密码"按账号自动维护，无需手工改）：
; SavedUser=最后一次登录名；RememberToken_<账号>=DPAPI 密文（本机本用户可解）
; （admin 普通管理，dev 最高权限，各记各的；ini 里永无明文密码）
; SavedUser=
; RememberToken_admin=
; RememberToken_dev=
; 账号说明：账号存 DataBase\CureLine.db3 users 表（PBKDF2 哈希，无明文），
; 首次启动自动播种 admin/dev；上线前必须进"设置→修改密码"改掉初始密码。

